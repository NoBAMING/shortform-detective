<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>숏폼 몰입 탐정</title>
<style>
*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#f7f4ff,#eefaf7);font-family:"Noto Sans KR","Malgun Gothic",sans-serif;color:#202124}
.wrap{max-width:760px;margin:auto;padding:28px 18px 48px}.card{background:#fff;border:1px solid #e8e8ef;border-radius:28px;box-shadow:0 16px 45px #2823501a;padding:30px}
.badge{display:inline-block;background:#f0edff;color:#5747c9;border-radius:999px;padding:8px 13px;font-weight:800;font-size:14px}
h1{font-size:38px;line-height:1.2;margin:18px 0 12px;letter-spacing:-1.5px}h2{font-size:27px;line-height:1.4;margin:20px 0 12px}
p{line-height:1.7}.goal,.result{background:#faf9ff;border-radius:20px;padding:20px;margin:22px 0}
button{border:0;border-radius:16px;padding:15px 20px;font-size:16px;font-weight:800;cursor:pointer}.primary{background:#6c5ce7;color:#fff;width:100%;margin-top:12px}.share{background:#111;color:#fff;width:100%;margin-top:16px}.secondary{background:#f1f1f6;color:#333;width:100%;margin-top:10px}
.progress{display:flex;justify-content:space-between;font-weight:800;color:#5d5d67;margin-bottom:15px}.bar{height:9px;background:#ececf3;border-radius:99px;overflow:hidden;margin-bottom:28px}.fill{height:100%;background:linear-gradient(90deg,#6c5ce7,#00b894)}
.option{display:block;width:100%;text-align:left;background:#fff;border:2px solid #e7e7ef;margin:12px 0;padding:17px 18px;border-radius:18px;font-weight:700;line-height:1.5}.option:hover,.selected{border-color:#6c5ce7;background:#f5f2ff}.small{font-size:14px;color:#777}.rank{font-size:14px;color:#6558c9;font-weight:900}.type{font-size:29px;font-weight:900;margin:6px 0}.footer{text-align:center;color:#999;font-size:12px;margin-top:18px}
</style>
</head>

<body>
<div class="wrap">
  <div class="card" id="app"></div>
  <div class="footer">숏폼 몰입 탐정 · 수업용 자기탐구 도구</div>
</div>

<script>
const Q=[
["즉시성","숏폼을 넘기다가 첫 장면부터 재미있어 보이는 영상이 나타났다. 나는?",["멈춰서 끝까지 본다.","조금 보고 재미있으면 끝까지 본다.","관심 있는 주제가 아니면 넘긴다."]],
["시각성","숏폼에 재미있는 자막, 음악, 효과가 함께 나오면 나는?",["더 재미있게 느낀다.","크게 상관없다.","오히려 없는 게 좋다."]],
["짧은 단위성","숏폼에서 긴 설명 없이 바로 중요한 장면으로 넘어가면 나는?",["좋다. 핵심 장면을 빨리 볼 수 있어서 재미있다.","빠르게 넘어가든 천천히 넘어가든 상관없다.","설명부터 차근차근 보는 것이 좋다."]],
["상호작용성","숏폼을 보다가 댓글이 궁금해졌다. 나는?",["바로 댓글을 확인한다.","가끔 댓글을 확인한다.","댓글은 거의 확인하지 않는다."]],
["연속성","숏폼 하나를 다 봤는데 바로 다음 영상이 나온다. 나는?",["다음 영상도 궁금해서 바로 본다.","제목이나 첫 장면을 보고 결정한다.","보고 있던 영상을 끝으로 멈춘다."]],
["개인화","숏폼 앱에서 내가 좋아하는 주제의 영상이 계속 추천된다면 나는?",["추천받는 대로 계속 본다.","추천받은 것 중에서 관심 있는 영상만 골라 본다.","추천보다 내가 직접 찾아본다."]],
["즉시성","숏폼을 보다가 잠깐 딴생각을 해서 중요한 장면을 놓쳤다. 나는?",["놓친 장면이 궁금해서 바로 다시 본다.","앞뒤 내용을 조금 확인해본다.","그냥 넘기고 다음 영상으로 간다."]],
["시각성","숏폼을 보다가 화면 전환이나 효과가 빠르게 바뀌면 나는?",["더 집중해서 보게 된다.","특별히 신경 쓰지 않는다.","복잡해서 오히려 집중하기 어렵다."]],
["짧은 단위성","숏폼에서 긴 이야기가 짧은 시간 안에 빠르게 진행되어 결말까지 도착하면 나는?",["좋다. 짧은 시간 안에 이야기의 끝까지 볼 수 있어서 재미있다.","이야기가 진행되는 속도는 크게 상관없다.","천천히 이야기가 진행되는 것이 더 재미있다."]],
["상호작용성","재미있는 숏폼을 발견해서 친구가 좋아할 것 같다. 나는?",["바로 친구에게 공유한다.","재미있으면 가끔 공유한다.","혼자 보는 편이다."]],
["연속성","“이번 영상까지만 보고 끄자”고 했는데 다음 영상이 궁금해졌다. 나는?",["궁금하니까 하나 더 본다.","잠깐 고민하고 볼지 말지 결정한다.","그래도 끈다."]],
["개인화","친구와 같은 앱을 사용하는데 나에게만 내가 좋아하는 영상이 추천된다면 나는?",["내 취향을 알아주는 것 같아서 더 재미있다.","추천 영상이 마음에 들면 본다.","추천보다 내가 직접 찾는 게 좋다."]]
];

const TYPES={
"즉시성":["⚡ 번개 발견형","재미있는 순간을 발견하면 바로 시선 고정!"],
"시각성":["🎬 장면 수집가형","눈과 귀를 사로잡는 장면을 그냥 지나치지 못함!"],
"짧은 단위성":["🪂 몰입 점프형","핵심 장면을 만나면 순식간에 이야기 속으로 점프!"],
"상호작용성":["🕵️ 댓글 탐정형","영상만 보고 끝내기엔 궁금한 게 너무 많음!"],
"연속성":["🚂 다음칸 승객형","하나의 영상이 끝나면 다음 이야기가 궁금해짐!"],
"개인화":["🎯 취향 저격형","내 취향을 찾아오는 영상은 그냥 지나치기 어렵지!"]
};

let order=[...Array(Q.length).keys()],pos=0,ans=Array(Q.length).fill(null);
order.sort(()=>Math.random()-.5);

function start(){
  pos=0;
  show();
}

function show(){
  let i=order[pos],q=Q[i];

  app.innerHTML=`
    <div class="progress">
      <span>탐정 질문 ${pos+1} / 12</span>
      <span>${Math.round((pos+1)/12*100)}%</span>
    </div>
    <div class="bar">
      <div class="fill" style="width:${(pos+1)/12*100}%"></div>
    </div>
    <div class="small">나의 숏폼 경험을 떠올려 보세요.</div>
    <h2>${q[1]}</h2>
    ${q[2].map((x,k)=>`
      <button class="option ${ans[i]===k?"selected":""}" onclick="pick(${k})">
        ${String.fromCharCode(65+k)}. ${x}
      </button>
    `).join("")}
    ${ans[i]!==null?'<button class="primary" onclick="next()">다음 질문 →</button>':""}
  `;
}

function pick(v){
  ans[order[pos]]=v;
  setTimeout(()=>{
    if(pos<11){
      pos++;
      show();
    }else{
      result();
    }
  },120);
}

function next(){
  if(pos<11){
    pos++;
    show();
  }else{
    result();
  }
}

function result(){
  let s={};
  Q.forEach((q,i)=>s[q[0]]=(s[q[0]]||0)+(2-ans[i]));

  let r=Object.entries(s).sort((a,b)=>b[1]-a[1]);
  let a=TYPES[r[0][0]],b=TYPES[r[1][0]];

  app.innerHTML=`
    <span class="badge">🕵️ 분석 완료!</span>
    <h1>당신에게 강하게 나타난<br>숏폼 유형!</h1>

    <div class="result">
      <div class="rank">🥇 1순위</div>
      <div class="type">${a[0]}</div>
      <div>${a[1]}</div>
    </div>

    <div class="result">
      <div class="rank">🥈 2순위</div>
      <div class="type">${b[0]}</div>
      <div>${b[1]}</div>
    </div>

    <p class="small">친구와 결과를 비교해 보세요.</p>

    <button class="share" onclick="share()">📝 퀴즈앤에서 활동하기</button>
    <button class="secondary" onclick="location.reload()">처음부터 다시 하기</button>
  `;
}

function share(){
  window.location.href="https://quizn.show/pbd/info/board/1165641";
}
app.innerHTML=`
  <span class="badge">🔍 숏폼 몰입 탐정</span>
  <h1>나는 왜 숏폼을<br>계속 보게 될까?</h1>

  <div class="goal">
    🎯 탐정의 목표<br>
    <span style="font-weight:600">
      나의 숏폼 습관을 살펴보고, 숏폼이 왜 재미있는지 알아보자!
    </span>
  </div>

  <p>
    평소 숏폼을 볼 때의 내 모습을 떠올리며 답해보세요.
    정답은 없어요. 가장 나다운 답을 골라주세요.
  </p>

  <button class="primary" onclick="start()">탐정 시작하기 🔎</button>
`;
</script>
</body>
</html>
